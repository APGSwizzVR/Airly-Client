name: Build Airly Client

on:
  workflow_dispatch:
  push:
    branches: [main, feature/modern-flight-tracking]
    paths:
      - "client/AirlyClient/**"
      - "installer/**"
      - ".github/workflows/build-airly-client.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish EXE
        run: dotnet publish client/AirlyClient/AirlyClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Smoke test published EXE
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "publish\AirlyClient.exe"
          if (!(Test-Path $exe)) { throw "Published EXE not found: $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "AirlyClient.exe exited during startup with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          Write-Host "AirlyClient.exe startup smoke test passed."

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer/AirlyClient.iss
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Airly-Client-win-x64
          path: publish/AirlyClient.exe
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Airly-Client-Installer-win-x64
          path: installer-output/Airly-Client-Setup.exe
